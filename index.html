<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1a1510">
<meta name="format-detection" content="telephone=no">
<title>Petit Cafe — Επιλογή γλώσσας</title>
<style>
:root{
 --cream:#f6ead8;
 --gold:#c8a66a;
 --line:rgba(200,166,106,.35);
 --safe-b:max(env(safe-area-inset-bottom), 0px);
 --safe-x:max(env(safe-area-inset-left), env(safe-area-inset-right), 0px);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
 color:var(--cream);
 min-height:100dvh;
 display:flex;
 flex-direction:column;
}
.lang-bg{
 position:fixed;
 inset:0;
 background:url("landing-sign.png") center/cover no-repeat;
 z-index:0;
}
.lang-scrim{
 position:fixed;
 inset:0;
 z-index:1;
 background:
  linear-gradient(180deg, rgba(10,8,6,.55) 0%, rgba(7,6,5,.72) 45%, rgba(5,4,3,.82) 100%);
}
.lang-main{
 position:relative;
 z-index:2;
 flex:1;
 display:flex;
 flex-direction:column;
 align-items:center;
 justify-content:center;
 padding:max(24px, var(--safe-x)) max(20px, var(--safe-x)) calc(28px + var(--safe-b));
}
.lang-title{
 margin:0 0 10px;
 font-family:Georgia,serif;
 font-size:clamp(22px, 5vw, 30px);
 font-weight:500;
 text-align:center;
 text-shadow:0 2px 28px rgba(0,0,0,.75);
 letter-spacing:.02em;
}
.lang-subtitle{
 margin:0 0 clamp(22px, 6vw, 40px);
 font-size:clamp(14px, 3.4vw, 17px);
 font-weight:600;
 text-align:center;
 color:rgba(246,234,216,.88);
 text-shadow:0 2px 18px rgba(0,0,0,.65);
 letter-spacing:.03em;
}
.lang-row{
 display:flex;
 flex-direction:row;
 align-items:stretch;
 justify-content:center;
 gap:clamp(20px, 6vw, 56px);
 flex-wrap:wrap;
 width:100%;
 max-width:520px;
 padding:12px 0;
 overflow:visible;
}
.lang-tile{
 flex:1 1 140px;
 max-width:220px;
 min-height:min(44vw, 200px);
 display:flex;
 flex-direction:column;
 align-items:center;
 justify-content:center;
 padding:22px 18px;
 text-decoration:none;
 color:var(--cream);
 background:rgba(10,9,8,.55);
 border:1px solid var(--line);
 border-radius:22px;
 backdrop-filter:blur(10px);
 -webkit-backdrop-filter:blur(10px);
 box-shadow:0 18px 48px rgba(0,0,0,.45);
 transition:border-color .2s ease, background .2s ease, box-shadow .2s ease, transform .28s ease;
}
.lang-tile:hover,.lang-tile:focus-visible{
 transform:translateY(-4px);
 border-color:var(--gold);
 background:rgba(18,15,12,.68);
 box-shadow:0 22px 52px rgba(0,0,0,.5);
 outline:none;
}
.lang-tile-inner{
 display:flex;
 flex-direction:column;
 align-items:center;
 justify-content:center;
 gap:14px;
 opacity:0;
 will-change:transform,opacity;
}
.lang-tile--el .lang-tile-inner{
 animation:langFromBelow .78s cubic-bezier(0.22,1,0.36,1) .12s forwards;
}
.lang-tile--en .lang-tile-inner{
 animation:langFromAbove .78s cubic-bezier(0.22,1,0.36,1) .12s forwards;
}
@keyframes langFromBelow{
 from{
  opacity:0;
  transform:translate3d(0,52px,0);
 }
 to{
  opacity:1;
  transform:translate3d(0,0,0);
 }
}
@keyframes langFromAbove{
 from{
  opacity:0;
  transform:translate3d(0,-52px,0);
 }
 to{
  opacity:1;
  transform:translate3d(0,0,0);
 }
}
@media (prefers-reduced-motion:reduce){
 .lang-tile--el .lang-tile-inner,
 .lang-tile--en .lang-tile-inner{
  animation:none;
  opacity:1;
  transform:none;
 }
 .lang-tile:hover,.lang-tile:focus-visible{transform:none}
}
.lang-flag{
 width:clamp(100px, 28vw, 132px);
 height:auto;
 display:block;
 flex-shrink:0;
 border-radius:10px;
 box-shadow:0 6px 20px rgba(0,0,0,.4);
}
.lang-flag--gr{
 aspect-ratio:3/2;
 object-fit:contain;
}
.lang-flag--gb{
 aspect-ratio:2/1;
}
.lang-label{
 font-size:clamp(16px, 4vw, 19px);
 font-weight:750;
 letter-spacing:.04em;
 margin-top:4px;
}
</style>
</head>
<body>
<div class="lang-bg" aria-hidden="true"></div>
<div class="lang-scrim" aria-hidden="true"></div>
<div class="lang-main">
<h1 class="lang-title">Petit Cafe — Vini &amp; Aperitivi</h1>
<p class="lang-subtitle">Επιλέξτε γλώσσα / Choose language</p>
<div class="lang-row">
<a class="lang-tile lang-tile--el" href="el.html" aria-label="Μενού στα ελληνικά">
<span class="lang-tile-inner">
<img class="lang-flag lang-flag--gr" src="flag-gr.png" alt="" width="300" height="200" decoding="async">
<span class="lang-label">Ελληνικά</span>
</span>
</a>
<a class="lang-tile lang-tile--en" href="en.html" aria-label="Menu in English">
<span class="lang-tile-inner">
<svg class="lang-flag lang-flag--gb" viewBox="0 0 60 30" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false"><rect width="60" height="30" fill="#012169"/><path d="M0 0L60 30M60 0L0 30" stroke="#fff" stroke-width="5"/><path d="M0 0L60 30M60 0L0 30" stroke="#C8102E" stroke-width="3"/><path d="M30 0v30M0 15h60" stroke="#fff" stroke-width="10"/><path d="M30 0v30M0 15h60" stroke="#C8102E" stroke-width="6"/></svg>
<span class="lang-label">English</span>
</span>
</a>
</div>
</div>
</body>
</html>
